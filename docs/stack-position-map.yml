# stack-position-map.yml — bron-van-waarheid voor de keten-positie van elk pakket.
# Verbruikt door `docs/scripts/apply_stack_position.py` (Fase 3).
#
# Per pakket:
#   <pkg_name>:
#     group: substrate | evidence | agentic | safety | conformance | specialized
#     prev: <pakket-naam>   (de logische voorganger in de keten, optioneel)
#     next: <pakket-naam>   (de logische opvolger in de keten, optioneel)
#
# Discipline (Jasper):
#  - de evidence-spine is linear: continuityd → cbom → sbom/ai-sbom → wayback → nis2 → report
#  - substrate is een paar (tibet-core ↔ jis-core)
#  - agentic is web-achtig; ainternet is de centrale hub
#  - specialized (oomllama) staat NAAST de ainternet-stack, eigen tijdlijn

# ════ SUBSTRATE — Rust/zero-trust onderlaag ════
tibet-core:
  group: substrate
  next: jis-core      # parallel substraat
jis-core:
  group: substrate
  prev: tibet-core
did-jis-core:
  group: substrate
  prev: jis-core      # DEPRECATED — alle did-* benamingen
tibet-timevector:
  group: substrate    # Causal TimeVector (Mattern/Fidge) — causality-flex BOVEN Lamport + CausalGuard (spontane-intentie = causaal onmogelijk)
  prev: jis-core

# ════ EVIDENCE-SPINE — arrival → ... → report ════
tibet-continuityd:
  group: evidence
  next: tibet-cbom    # arrival → CBOM
tibet-cbom:
  group: evidence
  prev: tibet-continuityd
  next: tibet-sbom
tibet-sbom:
  group: evidence
  prev: tibet-cbom
  next: tibet-ai-sbom
tibet-ai-sbom:
  group: evidence
  prev: tibet-sbom
  next: tibet-wayback
ai-sbom:
  group: evidence      # mooie korte naam (van ons), alias-rol naast tibet-ai-sbom
  prev: tibet-sbom
  next: tibet-wayback
tibet-wayback:
  group: evidence
  prev: tibet-ai-sbom
  next: tibet-nis2
tibet-snap:
  group: evidence      # DEPRECATED → tibet-wayback
  prev: tibet-wayback
tibet-nis2:
  group: evidence
  prev: tibet-wayback
  next: tibet-report
tibet-report:
  group: evidence
  prev: tibet-nis2
tibet-trail:
  group: evidence      # parallel: audit-trail reader / chain-tracing
  prev: tibet-report
tibet-audit:
  group: evidence      # 120+ compliance checks, parallel naar report/trail
  prev: tibet-nis2

